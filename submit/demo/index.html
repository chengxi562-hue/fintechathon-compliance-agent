<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>合规先审 · Demo｜FinTechathon</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --panel2: #182235;
    --border: #2a3a55;
    --text: #e8eef8;
    --muted: #8fa3c0;
    --accent: #3b82f6;
    --ok: #22c55e;
    --block: #ef4444;
    --warn: #f59e0b;
    --user: #1e3a5f;
    --bot: #1a2438;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: 1920px; height: 1080px; display: flex; flex-direction: column;
    position: relative;
  }
  /* Title bar */
  .topbar {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; background: #0a1020; border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .brand span { color: var(--accent); }
  .meta { font-size: 14px; color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: #1a2a18; color: #86efac; font-size: 12px; margin-left: 12px;
    border: 1px solid #2d4a2d;
  }
  /* Main split */
  .main { flex: 1; display: flex; min-height: 0; }
  .chat {
    width: 60%; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  .audit {
    width: 40%; display: flex; flex-direction: column; background: var(--panel2);
  }
  .pane-h {
    height: 44px; display: flex; align-items: center; padding: 0 20px;
    font-size: 14px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border); background: #0e1626;
  }
  .pane-h strong { color: var(--text); margin-right: 8px; }
  .cust {
    margin-left: auto; font-size: 13px; font-weight: 400;
    color: #93c5fd;
  }
  .msgs {
    flex: 1; padding: 20px 24px; overflow: hidden;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 88%; padding: 12px 16px; border-radius: 12px;
    font-size: 16px; line-height: 1.55; white-space: pre-wrap;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end; background: var(--user);
    border: 1px solid #2b4a75;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bot);
    border: 1px solid var(--border);
  }
  .msg.bot.block { border-left: 4px solid var(--block); }
  .msg.bot.allow { border-left: 4px solid var(--ok); }
  .msg .tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 4px; margin-bottom: 6px;
  }
  .tag.block { background: #3f1515; color: #fca5a5; }
  .tag.allow { background: #14301f; color: #86efac; }
  .product-card {
    margin-top: 10px; padding: 12px 14px; border-radius: 8px;
    background: #0f1a2e; border: 1px solid #334155;
    font-size: 14px; line-height: 1.5;
  }
  .product-card .name { font-weight: 700; color: #93c5fd; font-size: 15px; }
  .disclose {
    margin-top: 8px; font-size: 12px; color: var(--warn);
    border-top: 1px dashed #4a5568; padding-top: 8px;
  }
  .input-bar {
    height: 64px; border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
    background: #0e1626;
  }
  .input-fake {
    flex: 1; height: 40px; border-radius: 8px; background: #1a2438;
    border: 1px solid var(--border); padding: 0 14px;
    display: flex; align-items: center; font-size: 15px; color: var(--muted);
  }
  .input-fake .typed { color: var(--text); }
  .send-btn {
    width: 72px; height: 40px; border-radius: 8px; background: var(--accent);
    color: white; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  /* Audit */
  .audit-body {
    flex: 1; padding: 12px 14px; overflow: hidden;
    font-family: "Noto Sans Mono CJK SC", "Liberation Mono", "DejaVu Sans Mono", monospace;
    font-size: 12px; line-height: 1.45;
  }
  .audit-row {
    margin-bottom: 12px; padding: 10px 12px; border-radius: 8px;
    background: #0d1524; border: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }
  .audit-row.hi {
    border-color: var(--accent); box-shadow: 0 0 0 1px rgba(59,130,246,0.35);
  }
  .ar-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 12px;
  }
  .dec {
    font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
  }
  .dec.block { color: var(--block); }
  .dec.allow { color: var(--ok); }
  .rid { color: #60a5fa; font-size: 11px; }
  .gates { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .gate {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: #1e293b; color: var(--muted);
  }
  .gate.fail { background: #3f1515; color: #fca5a5; }
  .gate.pass { background: #14301f; color: #86efac; }
  .codes { color: #fbbf24; font-size: 11px; word-break: break-all; }
  .tools { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .hl { background: #1e3a5f; color: #bfdbfe; padding: 0 3px; border-radius: 2px; }
  /* Subtitle / VO */
  .subtitle {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 88px; background: linear-gradient(transparent, rgba(0,0,0,0.92));
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 80px 18px; pointer-events: none;
  }
  .sub-box {
    max-width: 1600px; text-align: center;
    font-size: 22px; line-height: 1.45; font-weight: 500;
    text-shadow: 0 2px 8px #000; color: #f8fafc;
  }
  .shot-label {
    position: absolute; top: 68px; left: 20px;
    background: rgba(0,0,0,0.65); color: #94a3b8;
    font-size: 13px; padding: 4px 10px; border-radius: 4px;
    z-index: 5;
  }
  /* Title overlay for shot 1 / 8 */
  .overlay {
    position: absolute; inset: 56px 0 88px 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(8,12,22,0.88); z-index: 4;
  }
  .overlay.show { display: flex; }
  .overlay .inner { text-align: center; }
  .overlay h1 { font-size: 56px; font-weight: 800; letter-spacing: 2px; margin-bottom: 18px; }
  .overlay h1 em { font-style: normal; color: var(--accent); }
  .overlay .sub { font-size: 22px; color: var(--muted); margin-bottom: 28px; }
  .overlay .pill {
    display: inline-block; padding: 8px 18px; border-radius: 999px;
    border: 1px solid #2d4a2d; background: #122018; color: #86efac; font-size: 16px;
  }
  .fail-table {
    margin: 24px auto 0; text-align: left; max-width: 720px;
    border-collapse: collapse; font-size: 16px;
  }
  .fail-table th, .fail-table td {
    border: 1px solid var(--border); padding: 8px 14px;
  }
  .fail-table th { background: #1a2438; color: var(--muted); font-weight: 600; }
  .fail-table td { background: #0d1524; }
  .fail-table .f { color: #fca5a5; }
  /* JSONL view shot 7 */
  .jsonl-view {
    position: absolute; inset: 56px 0 88px 0;
    display: none; background: #0a1020; z-index: 4;
    padding: 24px 40px; overflow: hidden;
  }
  .jsonl-view.show { display: block; }
  .jsonl-view h2 { font-size: 22px; margin-bottom: 14px; color: #93c5fd; }
  .jsonl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100% - 50px); }
  .jsonl-raw {
    background: #0d1524; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: monospace; font-size: 11px; line-height: 1.4;
    overflow: hidden; color: #94a3b8; white-space: pre-wrap; word-break: break-all;
  }
  .jsonl-fields {
    background: #0d1524; border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; display: flex; flex-direction: column; gap: 16px; justify-content: center;
  }
  .jf { padding: 14px 18px; border-radius: 8px; border: 2px solid var(--accent); background: #12203a; }
  .jf .k { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .jf .v { font-size: 18px; font-weight: 700; color: #e0f2fe; font-family: monospace; word-break: break-all; }
</style>
</head>
<body>

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAuditRow(r, highlight) {
  const dec = r.decision;
  const gates = (r.gate_results||[]).map(g =>
    `<span class="gate ${g.passed?'pass':'fail'}">${esc(g.name)}:${g.passed?'✓':'✗'} ${esc((g.reason_codes||[]).join(','))}</span>`
  ).join('');
  const tools = (r.tool_calls||[]).length
    ? (r.tool_calls||[]).map(t => {
        let s = t.tool;
        if (t.product_id) s += ` ${t.product_id}`;
        if (t.amount != null) s += ` amount=${t.amount}`;
        if (t.reasons) s += ` [${t.reasons.join(',')}]`;
        return s;
      }).join('; ')
    : '（无 · 模型未调用）';
  const note = r.note ? `<div class="tools" style="color:#fbbf24">注：${esc(r.note)}</div>` : '';
  return `<div class="audit-row ${highlight?'hi':''}">
    <div class="ar-head">
      <span class="dec ${dec}">${dec.toUpperCase()}</span>
      <span class="rid">${esc(r.request_id)}</span>
    </div>
    <div class="gates">${gates}</div>
    <div class="codes">reason_codes: ${esc((r.reason_codes||[]).join(' · '))}</div>
    <div class="tools">tool_calls: ${esc(tools)}</div>
    ${note}
  </div>`;
}

function botHtml(r) {
  const isBlock = r.decision === 'block';
  let body = `<div class="tag ${isBlock?'block':'allow'}">${isBlock?'BLOCK':'ALLOW'}</div>\n${esc(r.response)}`;
  if (r.product_id === 'WB_CASH_001') {
    body = `<div class="tag allow">ALLOW · SUIT_OK</div>
可为您介绍目录产品 <b>WB_CASH_001</b>。
<div class="product-card">
  <div class="name">微众灵活宝A（WB_CASH_001）</div>
  <div>流动性：T+0　｜　提示：2.1%~2.4%（近7日年化，非承诺）　｜　品类：货基</div>
  <div class="disclose">过往业绩不代表未来表现<br/>理财非存款，产品有风险</div>
</div>`;
  }
  return body;
}

const state = { msgs: [], audits: [], shot: 0 };

function setSubtitle(t){ document.getElementById('subBox').textContent = t; }
function setShotLabel(n){ document.getElementById('shotLabel').textContent = `镜 ${n} / 8`; }
function setInput(t){ document.getElementById('typed').textContent = t || ''; }
function paintMsgs(){
  const el = document.getElementById('msgs');
  el.innerHTML = state.msgs.map(m => {
    if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
    return `<div class="msg bot ${m.dec}">${m.html}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}
function paintAudit(hiLast){
  const el = document.getElementById('auditBody');
  el.innerHTML = state.audits.map((r,i) => renderAuditRow(r, hiLast && i===state.audits.length-1)).join('');
  document.getElementById('auditCount').textContent = state.audits.length + ' 行';
  el.scrollTop = el.scrollHeight;
}

      <tr><td>编码归一</td><td>部分明文碰巧命中</td><td class="f">已知失败</td></tr>
      <tr><td>中文品名（D06）</td><td>意图未识别品名</td><td class="f">已知失败</td></tr>
      <tr><td>注入门（D05）</td><td>未命中；金额门独立拦</td><td class="f">F* 交底</td></tr>
    </table>
    <div class="sub" style="margin-top:18px">表在仓库 · scripts/probe_adv_v0.py 可重跑</div>`;
}
function showJsonl(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('jsonlView').classList.add('show');
  const four = REPLAY.slice(0,4);
  document.getElementById('jsonlRaw').textContent = four.map(r => JSON.stringify({
    request_id:r.request_id, decision:r.decision,
    reason_codes:r.reason_codes, tool_calls:r.tool_calls
  })).join('\n');
  const last = four[four.length-1];
  document.getElementById('jsonlFields').innerHTML = `
    <div class="jf"><div class="k">request_id</div><div class="v">${esc(last.request_id)}</div></div>
    <div class="jf"><div class="k">gate_results（四道门）</div><div class="v">${esc(last.gate_results.map(g=>g.name+':'+(g.passed?'pass':'fail')).join(' · '))}</div></div>
    <div class="jf"><div class="k">reason_codes</div><div class="v">${esc(last.reason_codes.join(' · '))}</div></div>
    <div class="jf"><div class="k">tool_calls</div><div class="v">${esc(JSON.stringify(last.tool_calls))}</div></div>
    <div class="jf" style="border-color:#22c55e"><div class="k">decision 序列（镜2–5 首四行）</div><div class="v">block → allow → allow → block</div></div>`;
}
function hideOverlays(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('jsonlView').classList.remove('show');
}

function applyTurn(r, keepHistory){
  if (!keepHistory) { /* accumulate across demo */ }
  state.msgs.push({ role:'user', text: r.utterance });
  state.msgs.push({ role:'bot', dec: r.decision, html: botHtml(r) });
  state.audits.push(r);
  paintMsgs(); paintAudit(true);
  setInput('');
}

/** Freeze to end-state of shot N (1-8) for screenshot */
function freezeShot(n){
  state.msgs = []; state.audits = [];
  hideOverlays();
  setShotLabel(n);
  const shot = SHOTS[n-1];
  setSubtitle(shot.vo);
  setInput('');
  if (shot.mode === 'title') { showTitle(); paintMsgs(); paintAudit(false); return; }
  if (shot.mode === 'closing') {
    // show prior chats under overlay
    for (const idx of [0,1,2,3,4,5]) applyTurn(REPLAY[idx], true);
    showClosing(); return;
  }
  if (shot.mode === 'jsonl') {
    for (const idx of [0,1,2,3]) applyTurn(REPLAY[idx], true);
    showJsonl(); return;
  }
  // chat mode: apply all prior + current
  const idxs = Array.isArray(shot.replayIdx) ? shot.replayIdx : [shot.replayIdx];
  const maxIdx = Math.max(...idxs);
  for (let i=0; i<=maxIdx; i++) applyTurn(REPLAY[i], true);
  // highlight typing of last utterance briefly in input? leave empty after send
}

/** Progressive keyframes within a shot for richer video */
function freezeKeyframe(key){
  // keys: s1, s2a(input), s2b(result), s3a, s3b, s4a, s4b, s5a, s5b, s5c, s6a, s6b, s7, s8
  state.msgs=[]; state.audits=[]; hideOverlays(); setInput('');
  const map = {
    s1: () => { setShotLabel(1); setSubtitle(SHOTS[0].vo); showTitle(); paintMsgs(); paintAudit(false); },
    s2a: () => { setShotLabel(2); setSubtitle(SHOTS[1].vo); setInput(REPLAY[0].utterance); paintMsgs(); paintAudit(false); },
    s2b: () => { setShotLabel(2); setSubtitle(SHOTS[1].vo); applyTurn(REPLAY[0]); },
    s3a: () => { setShotLabel(3); setSubtitle(SHOTS[2].vo); applyTurn(REPLAY[0]); setInput(REPLAY[1].utterance); },
    s3b: () => { setShotLabel(3); setSubtitle(SHOTS[2].vo); applyTurn(REPLAY[0]); applyTurn(REPLAY[1]); },
    s4a: () => { setShotLabel(4); setSubtitle(SHOTS[3].vo); [0,1].forEach(i=>applyTurn(REPLAY[i])); setInput(REPLAY[2].utterance); },
    s4b: () => { setShotLabel(4); setSubtitle(SHOTS[3].vo); [0,1,2].forEach(i=>applyTurn(REPLAY[i])); },
    s5a: () => { setShotLabel(5); setSubtitle(SHOTS[4].vo); [0,1,2].forEach(i=>applyTurn(REPLAY[i])); setInput(REPLAY[3].utterance); },
    s5b: () => { setShotLabel(5); setSubtitle(SHOTS[4].vo); [0,1,2,3].forEach(i=>applyTurn(REPLAY[i])); },
    s5c: () => { setShotLabel(5); setSubtitle(SHOTS[4].vo); [0,1,2,3].forEach(i=>applyTurn(REPLAY[i])); setInput(REPLAY[4].utterance); },
    s5d: () => { setShotLabel(5); setSubtitle(SHOTS[4].vo); [0,1,2,3,4].forEach(i=>applyTurn(REPLAY[i])); },
    s6a: () => { setShotLabel(6); setSubtitle(SHOTS[5].vo); [0,1,2,3,4].forEach(i=>applyTurn(REPLAY[i])); setInput(REPLAY[5].utterance); },
    s6b: () => { setShotLabel(6); setSubtitle(SHOTS[5].vo); [0,1,2,3,4,5].forEach(i=>applyTurn(REPLAY[i])); },
    s7:  () => { setShotLabel(7); setSubtitle(SHOTS[6].vo); [0,1,2,3].forEach(i=>applyTurn(REPLAY[i])); showJsonl(); },
    s8:  () => { setShotLabel(8); setSubtitle(SHOTS[7].vo); [0,1,2,3,4,5].forEach(i=>applyTurn(REPLAY[i])); showClosing(); },
  };
  (map[key]||map.s1)();
}

// URL: ?freeze=2 or ?kf=s2b or autoplay
const params = new URLSearchParams(location.search);
if (params.has('kf')) {
  freezeKeyframe(params.get('kf'));
} else if (params.has('freeze')) {
  freezeShot(parseInt(params.get('freeze'),10)||1);
} else if (params.get('auto') === '1') {
  // simple autoplay for interactive viewing
  (async () => {
    for (let n=1; n<=8; n++) {
      freezeShot(n);
      await new Promise(r => setTimeout(r, SHOTS[n-1].dur * 1000));
    }
  })();
} else {
  freezeShot(1);
}

// blink cursor
setInterval(() => {
  const c = document.getElementById('cursor');
  if (c) c.style.opacity = c.style.opacity === '0' ? '1' : '0';
}, 500);

window.__demo = { freezeShot, freezeKeyframe, SHOTS, REPLAY };
</script>
